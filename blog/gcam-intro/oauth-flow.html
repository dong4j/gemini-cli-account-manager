<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OAuth 登录流程</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #020617;
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      padding: 2rem;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .header h1 {
      color: #fb7185;
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .header p {
      color: #94a3b8;
      font-size: 0.85rem;
    }
    .diagram-card {
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.5rem;
    }
    .diagram-container {
      width: 100%;
      overflow-x: auto;
    }
    .diagram-container svg {
      width: 100%;
      height: auto;
      max-width: 100%;
    }
    .footer {
      text-align: center;
      margin-top: 2rem;
      color: #64748b;
      font-size: 0.7rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>OAuth 登录流程</h1>
      <p>浏览器授权 → 本地服务器接收 → 令牌交换 → 账号入池</p>
    </div>

    <div class="diagram-card">
      <div class="diagram-container">
        <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
              <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
            </marker>
            <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
              <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5"/>
            </pattern>
          </defs>

          <rect width="100%" height="100%" fill="url(#grid)"/>

          <!-- Step 1: User starts login -->
          <rect x="380" y="30" width="240" height="50" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
          <text x="500" y="52" fill="white" font-size="11" font-weight="600" text-anchor="middle">gcam pool login</text>
          <text x="500" y="68" fill="#94a3b8" font-size="9" text-anchor="middle">启动 OAuth 流程</text>

          <!-- Arrow 1->2 -->
          <path d="M 500 80 L 500 110" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>

          <!-- Step 2: Local server starts -->
          <rect x="380" y="110" width="240" height="50" rx="6" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
          <text x="500" y="132" fill="white" font-size="11" font-weight="600" text-anchor="middle">启动本地 OAuth Server</text>
          <text x="500" y="148" fill="#94a3b8" font-size="9" text-anchor="middle">监听 127.0.0.1:随机端口</text>

          <!-- Arrow 2->3 -->
          <path d="M 500 160 L 500 190" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>

          <!-- Step 3: Open browser -->
          <rect x="380" y="190" width="240" height="50" rx="6" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
          <text x="500" y="212" fill="#fbbf24" font-size="11" font-weight="600" text-anchor="middle">打开浏览器</text>
          <text x="500" y="228" fill="#94a3b8" font-size="9" text-anchor="middle">跳转 Google 授权页面</text>

          <!-- Arrow 3->4 -->
          <path d="M 500 240 L 500 270" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowhead)"/>

          <!-- Google OAuth box -->
          <rect x="300" y="270" width="400" height="60" rx="8" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="2"/>
          <text x="500" y="295" fill="#fbbf24" font-size="12" font-weight="600" text-anchor="middle">Google OAuth Authorization</text>
          <text x="500" y="315" fill="#94a3b8" font-size="9" text-anchor="middle">accounts.google.com/o/oauth2/v2/auth</text>

          <!-- Arrow 4->5 (user auth in browser) -->
          <path d="M 620 330 L 750 370" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowhead)"/>
          <path d="M 380 330 L 250 370" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowhead)"/>

          <!-- User interaction -->
          <rect x="100" y="370" width="200" height="50" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
          <text x="200" y="392" fill="white" font-size="11" font-weight="600" text-anchor="middle">用户登录 & 授权</text>
          <text x="200" y="408" fill="#94a3b8" font-size="9" text-anchor="middle">选择 Google 账号</text>

          <!-- Callback to local server -->
          <rect x="700" y="370" width="200" height="50" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
          <text x="800" y="392" fill="white" font-size="11" font-weight="600" text-anchor="middle">回调到本地 Server</text>
          <text x="800" y="408" fill="#94a3b8" font-size="9" text-anchor="middle">携带 Authorization Code</text>

          <!-- Arrow 5->6 -->
          <path d="M 500 330 L 500 360" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>

          <!-- Step 6: Exchange code for tokens -->
          <rect x="380" y="430" width="240" height="50" rx="6" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1.5"/>
          <text x="500" y="452" fill="white" font-size="11" font-weight="600" text-anchor="middle">Code 换取 Token</text>
          <text x="500" y="468" fill="#94a3b8" font-size="9" text-anchor="middle">调用 Google Token 端点</text>

          <!-- Labels -->
          <text x="500" y="500" fill="#64748b" font-size="8" text-anchor="middle" font-style="italic">完整的 OAuth 2.0 授权码流程</text>

        </svg>
      </div>
    </div>

    <div class="footer">
      <p>gcam OAuth 流程 | 支持 offline access + refresh_token</p>
    </div>
  </div>
</body>
</html>
