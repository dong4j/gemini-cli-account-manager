name: Go Build & Test

on:
  push:
    branches: [ main ]
    # 忽略 tag push，避免与 release.yml 重复执行
    tags-ignore:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'

    - name: Build
      run: go build -v -o gcam ./cmd/gcam

    - name: Test
      run: go test -v ./...
